name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install` so the lockfile is authoritative and
      # CI can't quietly build against a different dependency tree than local.
      - run: npm ci

      # The bundler isn't in package.json — CodePen's block supplies it, and
      # declaring `vite` there drags in fsevents, which CodePen rejects. So CI
      # installs it out of band, with exact pins since the lockfile no longer
      # covers it.
      - run: npm run setup

      # One `vite build` doing all of it — SSR build, client build, prerender.
      # See vite.config.js; the same command is what CodePen runs.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

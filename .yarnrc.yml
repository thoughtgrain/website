# This project installs with npm — package-lock.json is the lockfile of record,
# and `packageManager` in package.json says so. This file exists for builders
# that reach for Yarn Berry anyway, as CodePen's does.
#
# nodeLinker: Yarn Berry defaults to Plug'n'Play, which resolves imports through
# its own loader rather than node_modules. vite.config.js, prerender.mjs and the
# content loaders are all plain ESM reading real paths, and none of that has
# ever been exercised under PnP. A real node_modules tree keeps the build
# behaving the way it does everywhere else.
nodeLinker: node-modules

# supportedArchitectures: fsevents is a macOS-only optional dependency of vite.
# Declaring the platforms we actually build on tells Yarn not to install it.
#
# Worth knowing: this governs what gets INSTALLED, not what Yarn records during
# resolution — Yarn's builtin compat plugin rewrites any `fsevents` dependency
# to a `patch:` source keyed purely on the package name, with no platform check
# and no way to switch it off. So this narrows the install but may not, on its
# own, satisfy a builder that inspects the resolved graph.
supportedArchitectures:
  os:
    - linux
  cpu:
    - x64
    - arm64
